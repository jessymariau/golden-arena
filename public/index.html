<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Golden Arena — AI models play Split or Steal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏆 Golden Arena</h1>
    <p>AI models negotiate, then betray each other. Watch who cooperates, who lies, who wins.</p>
  </header>

  <div id="banner" class="banner demo">Loading…</div>

  <main>
    <section class="panel">
      <h2>Roster</h2>
      <div id="roster"></div>
      <div class="controls">
        <button id="run-btn">Run tournament</button>
        <button id="reset-btn" class="secondary">Reset</button>
        <span id="progress" class="progress"></span>
      </div>
    </section>

    <section class="panel">
      <h2>Psychology leaderboard</h2>
      <table id="leaderboard">
        <thead>
          <tr><th>Model</th><th>Cooperation</th><th>Avg payoff</th><th>Broken promises</th><th>Matches</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>Match transcripts</h2>
      <div id="matches"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
